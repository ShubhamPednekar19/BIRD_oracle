# Experiment config for run_experiment_matrix.py
#
# HOW TO USE THIS FILE:
# 1) Keep the JSON braces/quotes/commas structure.
# 2) You can add comments on separate lines starting with '#'.
# 3) To run multiple experiments for one field, add multiple values in the list.
#
# Example (multiple values):
# "modes": ["unified", "parallel"]
# "search_types": ["vector", "hybrid"]
# "dataset_forms": ["single-user", "multiple"]

{
  # Required DB connection for every experiment
  "connection_string": "xxx",

  # Total 2 modes you asked for
  "modes": ["unified", "parallel"],

  # For each mode, run both search types
  "search_types": ["vector", "hybrid"],

  # Only used when search_type = hybrid
  "hybrid_scorers": ["RSF", "RRF"],

  # Run both dataset forms:
  # - single-user => --single-user-mode (union schema)
  # - multiple    => individual schemas
  "dataset_forms": ["single-user", "multiple"],

  # Common args passed to all experiments
  "common": {
    "discover_k": 10,
    "discover_score_threshold": 0.60
  },

  # Scorer-specific args for hybrid runs
  "scorer_overrides": {
    "RSF": {
      "discover_vector_score_weight": 10,
      "discover_text_score_weight": 2
    },
    "RRF": {
      "discover_vector_rank_penalty": 2,
      "discover_text_rank_penalty": 1
    }
  },

  # Output hierarchy root
  "results_root": "results",

  # Optional extra CLI args appended to every run
  # Example:
  # "passthrough_args": ["--max-questions", "100"]
  "passthrough_args": []
}
